# pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ltrs"
version = "1.0.0"
authors = [
  { name="AoP Developer", email="aop.dev@example.com" },
]
description = "An interpreter for the Alphabet of Powers mathematical system."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Environment :: Console",
]
dependencies = [
    "matplotlib",
    "numpy", # numpy is used in aop_visualizer.py
    "requests", # For AI explainer feature
]

[project.urls]
"Homepage" = "https://github.com/placeholder-username/letter-powers"
"Bug Tracker" = "https://github.com/placeholder-username/letter-powers/issues"

# This is the magic part that creates the `ltrs` command!
[project.scripts]
ltrs = "aopl_python_impl.aop_calculator_cli:main"
