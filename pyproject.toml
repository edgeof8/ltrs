# ltrs/pyproject.toml

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
# The project name can be anything, e.g., "aop-calculator"
name = "aop-calculator"
version = "0.1.0"

# --- THIS SECTION IS THE FIX ---
# We define a "src-layout" which is standard for mixed projects.
[tool.maturin]
# This tells maturin that the Python package 'aopl_python_impl' is inside the 'src' directory.
python-source = "src"
# This tells maturin where to find the Rust crate to compile.
manifest-path = "aop_rust_core/Cargo.toml"
# This tells maturin the name of the Python module it should create.
# It MUST match the one defined in your Rust lib.rs (`#[pymodule] fn aop_rust_core(...)`).
module-name = "aopl_python_impl.aop_rust_core"
