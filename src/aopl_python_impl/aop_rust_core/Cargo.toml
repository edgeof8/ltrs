[package]
name = "aop_rust_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "aop_rust_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The `serde` feature is for serialization, which is good practice.
num-bigint = { version = "0.4", features = ["serde"] }
num-integer = "0.1.45"
num-traits = "0.2"
once_cell = "1.18.0"
rayon = "1.8.0"
regex = "1"

# `extension-module` is enabled by maturin when building the Python wheel so
# `cargo test` can still link the rlib without Python.
pyo3 = { version = "0.20.3", features = ["num-bigint"] }

[features]
extension-module = ["pyo3/extension-module"]

[dev-dependencies]
criterion = "0.5"
