[package]
name = "aop_rust_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "aop_rust_core"
crate-type = ["cdylib"]

[dependencies]
num-bigint = { version = "0.4", features = ["serde"] }
num-integer = "0.1.45"
num-traits = "0.2"
once_cell = "1.18.0"
rayon = "1.8.0"

# --- THIS IS THE FIX ---
# Add the "num-bigint" feature directly to the pyo3 dependency.
# Remove the pyo3-num line.
pyo3 = { version = "0.20.0", features = ["extension-module", "num-bigint"] }
